version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite+aiosqlite:///data/docchat.db
      - CHROMA_PATH=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - DATA_DIR=/app/data
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
