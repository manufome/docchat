server {
    listen 8080;
    server_name _;

    # SPA — serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy — BACKEND_URL is injected by envsubst at container start
    # On Railway: set BACKEND_URL = https://your-backend.up.railway.app
    # On Docker Compose: BACKEND_URL defaults to http://backend:8000
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;  # Required for SSE
    }
}
