server {
    listen 8080;
    server_name _;

    # Railway internal DNS resolver — required so nginx re-resolves
    # the backend hostname after each redeploy (private IPs change).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SPA — serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy — BACKEND_URL is injected by envsubst at container start.
    # Using a nginx variable (not plaintext) forces nginx to use the
    # resolver above for each DNS resolution, avoiding stale IPs.
    #
    # Set BACKEND_URL to host:port only (no protocol):
    #   Railway:            docchat-backend.railway.internal:8000
    #   Docker Compose:     backend:8000
    set $backend_upstream ${BACKEND_URL};

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;  # Required for SSE
    }
}
