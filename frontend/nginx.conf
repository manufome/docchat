server {
    listen 8080;
    server_name _;

    # SPA — serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy — BACKEND_URL is injected via envsubst at container startup.
    #
    # On Railway:           use "Add Reference" to the backend service.
    #                       Railway injects the correct public URL
    #                       (e.g. https://docchat-backend-production-xxxx.up.railway.app).
    #
    # On Docker Compose:    set BACKEND_URL=http://backend:8000
    #
    # proxy_ssl_verify off is safe because nginx only applies it
    # when the upstream uses HTTPS; HTTP upstreams ignore it.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;  # Required for SSE
        proxy_ssl_verify off;
    }
}
