server {
    listen 8080;
    server_name _;

    # SPA — serve index.html for all non-file routes.
    # No API proxy — the React app calls the backend directly
    # using VITE_API_URL (build-time variable on Railway).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
