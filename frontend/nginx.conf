server {
    listen 8080;
    server_name _;

    # SPA — serve index.html for all non-file routes.
    # config.js is generated at container start from the BACKEND_URL
    # env var (see Dockerfile entrypoint).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
